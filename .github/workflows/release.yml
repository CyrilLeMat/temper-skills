name: Release

# Tag vX.Y.Z (matching pyproject version) and push it — publishes to PyPI via
# trusted publishing (OIDC, no token secret). One-time setup on pypi.org:
# Account → Publishing → add pending publisher for project "temper-skills",
# owner CyrilLeMat, repo temper-skills, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$V"; exit 1; }
      - run: pipx run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from the CHANGELOG section
        run: |
          python - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]           # vX.Y.Z
          version = tag.lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.MULTILINE | re.DOTALL)
          body = m.group(1).strip() if m else f"See CHANGELOG.md for {version}."
          open("release_notes.md", "w").write(body)
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release_notes.md
